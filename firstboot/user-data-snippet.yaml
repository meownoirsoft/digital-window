## Digital Window — first-boot install (Raspberry Pi OS Trixie / cloud-init)
##
## After Raspberry Pi Imager writes the SD card, open the "bootfs" partition,
## edit the `user-data` file, and paste the block below at the END of it.
##
## - Keep everything Imager wrote (user, Wi-Fi, SSH). Don't remove "#cloud-config"
##   from the top line of that file.
## - If the file already has a "runcmd:" or "power_state:" section, add these
##   entries to that section instead of adding a second one.
## - Optional: put your free key from https://api.nasa.gov on the NASA_KEY line
##   below (keep the quotes). DEMO_KEY works but is rate-limited.
##
## First boot then takes ~5–10 minutes: it waits for the network, installs the
## app, and reboots straight into the fullscreen player.
## Install log on the Pi: /var/log/digital-window-install.log

runcmd:
  - - sh
    - -c
    - |
      NASA_KEY="DEMO_KEY"
      # Wait up to 5 minutes for the network (Wi-Fi can come up after cloud-init starts).
      for i in $(seq 60); do curl -fsI https://github.com >/dev/null 2>&1 && break; sleep 5; done
      # The desktop user Imager created (first regular account, uid 1000).
      u=$(getent passwd 1000 | cut -d: -f1)
      su - "$u" -c "curl -fsSL https://raw.githubusercontent.com/meownoirsoft/digital-window/main/install.sh | NASA_API_KEY=$NASA_KEY bash" \
        > /var/log/digital-window-install.log 2>&1

power_state:
  mode: reboot
  message: Digital Window installed, rebooting into the player
